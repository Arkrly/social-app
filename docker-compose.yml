version: '3.8'

services:
  # MySQL Database
  db:
    image: mysql:8.0
    container_name: social_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${DB_NAME:-social_db}
      MYSQL_USER: ${DB_USER:-socialuser}
      MYSQL_PASSWORD: ${DB_PASSWORD:-socialpassword}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-rootpassword}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - social_network

  # Java Web Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: social_app
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-social_db}
      DB_USER: ${DB_USER:-socialuser}
      DB_PASSWORD: ${DB_PASSWORD:-socialpassword}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - social_network

volumes:
  mysql_data:
    driver: local

networks:
  social_network:
    driver: bridge
